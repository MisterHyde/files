# Rebind the prefix key
set-option -g prefix C-d

# Color options
set-option -g default-terminal "tmux-256color"
#set -g utf8
#set-window-option -g utf8 on

# Vi Modus
set-option -g status-keys vi
set-option -g mode-keys vi
bind-key : command-prompt
bind-key h select-pane -L
#bind-key c-h select-pane -L
bind-key j select-pane -D
#bind-key c-j select-pane -D
bind-key k select-pane -U
#bind-key c-k select-pane -U
bind-key l select-pane -R
#bind-key c-l select-pane -R

# use vim-like keys for splits and windows
bind-key v split-window -h -c "#{pane_current_path}"
bind | split-window -h # horizontal columns
bind - split-window -v # vertical rows

## Mouse support
set -g mouse on

## Config reload
bind-key r source-file ~/.tmux.conf \; display-message "tmux.conf reloaded."

# Using Shift-Keys
bind-key -n S-Left previous-window
bind-key -n S-Right next-window
bind-key -n S-Up command-prompt -I "rename-window "
bind-key -n S-Down new-window
bind-key -n C-S-Left swap-window -t -1
bind-key -n C-S-Right swap-window -t +1

## History
set-option -g history-limit 10000

## Time to display pane numbers wenn hitting c-d q
set-option -g display-panes-time 1500

set-window-option -g automatic-rename on
set-option -g allow-rename off

#{session_id} : unique session ID,
#S : session title,
#F : window flags (Info about which windows is active etc.),
#{window_id} : unique window ID,
#I : window index,
#W : window title,
#{window_panes} : number of active panes in current window,
#D : unique pane number,
#P : dynamic pane number,
#T : pane title

##For panes their unique identifier is a number prefixed with % and for windows a number prefixed with @.
##For sessions prefixed with $.
##

bind-key [ copy-mode
bind-key ] paste-buffer

bind-key -T edit-mode-vi Up send-keys -X history-up
bind-key -T edit-mode-vi Down send-keys -X history-down
unbind-key -T copy-mode-vi Space     ;   bind-key -T copy-mode-vi v send-keys -X begin-selection
unbind-key -T copy-mode-vi Enter     ;   bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "reattach-to-user-namespace pbcopy"
unbind-key -T copy-mode-vi C-v       ;   bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
unbind-key -T copy-mode-vi [         ;   bind-key -T copy-mode-vi [ send-keys -X begin-selection
unbind-key -T copy-mode-vi ]         ;   bind-key -T copy-mode-vi ] send-keys -X copy-selection

# Set window notifications
setw -g monitor-activity on
set -g visual-activity on

## renumber windows when a window is closed
set -g renumber-windows on

# Toggle mouse support of with m/M
bind m set-option -g mouse on \; display 'Mouse: ON'

bind M set-option -g mouse off \; display 'Mouse: OFF'

# Make the current window the first window
bind T swap-window -t 1

# ── Wayland clipboard integration ─────────────────────────────────

# Use vi keys in copy mode (optional but recommended)
set -g mode-keys vi

# Enter copy mode with prefix + [  (default, kept as-is)
# Paste with prefix + P (capital) from tmux buffer, or just Ctrl+Shift+V in terminal

# y in copy mode → yank selection into BOTH tmux buffer and Wayland clipboard
bind -T copy-mode-vi y \
  send-keys -X copy-pipe-and-cancel "wl-copy"

# Mouse drag to select → also pipes to Wayland clipboard on release
bind -T copy-mode-vi MouseDragEnd1Pane \
  send-keys -X copy-pipe-and-cancel "wl-copy"

# Prefix + P → paste from Wayland clipboard into tmux
bind p run "wl-paste --no-newline | tmux load-buffer - && tmux paste-buffer"
#bind h run "cliphist list | wofi --dmenu | cliphist decode | wl-copy && wl-paste --no-newline | tmux load-buffer - && tmux paste-buffer"

#run ~/.config/tmux/plugins/tmux-cpu/cpu.tmux
#run ~/.config/tmux/plugins/tmux-battery/battery.tmux


# ── Powerline symbols ──────────────────────────────────────────────
PL_RIGHT="U+E0B2"   # U+E0B2  solid right-to-left arrow
PL_RIGHT_THIN="U+E0B3" # U+E0B3  thin separator

# ── General ───────────────────────────────────────────────────────
set -g status on
set -g status-interval 30          # refresh every 30 s
set -g status-position bottom
set-option -g base-index 0
set-window-option -g pane-base-index 0

# ── Colours (256-colour names) ─────────────────────────────────────
# Segment palette
BG_BAR="colour235"      # #282828 – gruvbox bg
BG_WIN="colour237"      # #3c3836 – gruvbox bg1  (inactive windows)
BG_ACT="colour178"      # #fabd2f – gruvbox yellow (active window)
BG_HOST="colour239"     # #504945 – gruvbox bg2
BG_DATE="colour237"     # #3c3836 – gruvbox bg1
BG_TIME="colour108"     # #8ec07c – gruvbox bright aqua
FG_MAIN="colour223"     # #ebdbb2 – gruvbox fg
FG_ACT="colour232"      # #282828 – dark text on the yellow active tab
FG_DIM="colour246"      # #a89984 – gruvbox fg4

# ── Left side: nothing (or add session name if you like) ──────────
set -g status-left ""
set -g status-left-length 0

# ── Window list (centred) ──────────────────────────────────────────
set -g status-justify left

# inactive window
setw -g window-status-format \
  "#[fg=$FG_DIM,bg=$BG_BAR] #I #[fg=$FG_DIM]#W "

# active window  (powerline arrows around it)
setw -g window-status-current-format \
  "#[fg=$BG_ACT,bg=$BG_BAR]#[fg=$FG_MAIN,bg=$BG_ACT,bold] #I  #W #[fg=$BG_ACT,bg=$BG_BAR]"

# ── Right side: hostname | date | time ────────────────────────────
set -g status-right-length 60
set -g status-right \
  "#[fg=$BG_HOST,bg=$BG_BAR]#[fg=$FG_MAIN,bg=$BG_HOST] #H \
#[fg=$BG_DATE,bg=$BG_HOST]#[fg=$FG_MAIN,bg=$BG_DATE] %d-%b-%y \
#[fg=$BG_TIME,bg=$BG_DATE]#[fg=$FG_MAIN,bg=$BG_TIME,bold] %H:%M #[default]"
#set -g status-right "#{host} %Y-%m-%d %H:%M #{battery_graph}"

# ── Bar background ─────────────────────────────────────────────────
set -g status-style "bg=$BG_BAR,fg=$FG_DIM"
